<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text & URL Summarizer</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="favicon.png" type="image/png">
</head>
<body>
    <div class="container">
        <h1>Text & URL Summarizer</h1>
        <p class="description">Paste text or a URL below to get a concise bullet-point summary</p>
        
        <div class="input-container">
            <textarea id="input-field" placeholder="Paste text or URL here..."></textarea>
            <p class="input-hint">For best results with URLs, try pasting the article text directly if you encounter CORS issues.</p>
            <button id="submit-btn">Summarize</button>
        </div>
        
        <div id="loading" class="hidden">
            <div class="spinner"></div>
            <p>Generating summary...</p>
        </div>
        
        <div id="error-container" class="hidden">
            <h3>Error</h3>
            <p id="error-message"></p>
            <button id="error-dismiss">Dismiss</button>
        </div>
        
        <div id="result-container" class="hidden">
            <h2>Summary</h2>
            <ul id="summary-list"></ul>
        </div>
    </div>
